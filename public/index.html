<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mafia</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#19496c,#071424 60%,#020711);color:#eff8ff;font:15px system-ui;padding:16px}main{max-width:1000px;margin:auto}.logo{font-size:40px;font-weight:1000}.logo span{color:#ff526d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.card{background:#0c1d31;border:1px solid #294764;border-radius:15px;padding:16px}.wide{grid-column:1/-1}.hidden{display:none!important}h2{font-size:18px;margin:0 0 12px}input,select{width:100%;padding:11px;background:#04101d;border:1px solid #36536d;border-radius:8px;color:white;margin:5px 0 10px}button{padding:11px;border:1px solid #3882b5;border-radius:9px;background:#0867a5;color:white;font-weight:800;cursor:pointer;margin:3px}.green{background:#12643f}.red{background:#9c2940}.gold{background:#986016}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.player,.choice{background:#061321;border:1px solid #25425d;border-radius:9px;padding:10px;margin:5px 0}.muted{color:#9bb9d2;font-size:13px}.code{font-size:32px;letter-spacing:4px;color:#5cff9a;font-weight:900}.role{font-size:23px;font-weight:900;text-align:center;padding:14px;border-radius:10px}.citizen{background:#073c65}.doctor{background:#06442f}.imposter{background:#531d2a}.chat{height:160px;overflow:auto;background:#04101d;padding:9px;border-radius:8px}.msg{padding:6px;background:#10263b;margin:5px 0;border-radius:6px}.row{display:flex;gap:7px}.row>*{flex:1}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.logo{font-size:32px}}
</style></head><body><main><header><div class="logo">MAF<span>IA</span> 🚀</div><p class="muted">Secret roles. Trust nobody. Vote wisely.</p></header><div class="grid">
<section class="card"><h2>🛸 Create room</h2><label class="muted">Nickname</label><input id="name" value="StarBoy" maxlength="16"><div class="row"><div><label class="muted">Max players</label><select id="max"><option>4</option><option>6</option><option>8</option><option>10</option><option selected>12</option></select></div><div><label class="muted">Imposters</label><select id="imps"><option>1</option><option selected>2</option><option>3</option></select></div></div><button class="green" onclick="create()">CREATE ROOM</button><hr><h2>🔐 Join room</h2><input id="joinCode" placeholder="ROOM CODE" maxlength="6"><button onclick="join()">JOIN</button></section>
<section class="card"><h2>👨‍🚀 Lobby</h2><div class="code" id="code">------</div><p class="muted" id="status">Create or join a room</p><div id="players" class="players"></div><button class="gold" onclick="start()">START MATCH</button></section>
<section class="card wide hidden" id="game"><div class="row"><h2>🌌 Match</h2><span id="phase" class="muted">LOBBY</span></div><div id="role"></div><div id="fellow" class="muted"></div><div id="actions"></div><h2>💬 Chat</h2><div class="row"><select id="channel"><option value="public">Meeting chat</option><option value="imposter">Private imposter chat</option></select><input id="message" placeholder="Message (meeting phase only for public)"></div><button onclick="chat()">SEND MESSAGE</button><div class="chat" id="chat"></div><p id="announcement" class="muted"></p></section></div></main>
<script src="/socket.io/socket.io.js"></script><script>
const s=io();let room,state;const $=x=>document.getElementById(x);s.on('room',r=>{room=r;$('code').textContent=r.code;$('status').textContent=`${r.phase} · ${r.players.length}/${r.max} players · ${r.imposters} imposters`;$('players').innerHTML=r.players.map(p=>`<div class="player">${esc(p.name)} ${p.host?'👑':''}<div class="muted">${p.alive?'Alive':'Eliminated'}</div></div>`).join('');if(r.phase!=='lobby')$('game').classList.remove('hidden');$('announcement').textContent=r.message||'';render()});s.on('privateState',x=>{state=x;$('game').classList.remove('hidden');$('phase').textContent=x.phase.toUpperCase();$('role').innerHTML=`<div class="role ${x.role}">YOUR ROLE: ${x.role.toUpperCase()}</div>`;$('fellow').textContent=x.role==='imposter'?'Fellow imposters: '+(x.fellowImposters.map(p=>p.name).join(', ')||'none'):x.role==='doctor'?'You are the doctor. Your role is secret.':'Your role is citizen. Find the imposters.';render()});s.on('announcement',m=>$('announcement').textContent=m);s.on('toast',alert);s.on('chat',m=>{let d=document.createElement('div');d.className='msg';d.textContent=m.name+': '+m.text;$('chat').append(d);$('chat').scrollTop=$('chat').scrollHeight});
function ack(e,d){s.emit(e,d,r=>{if(r&&!r.ok)alert(r.error)})}function create(){ack('createRoom',{name:$('name').value,max:+$('max').value,imposters:+$('imps').value})}function join(){ack('joinRoom',{name:$('name').value,code:$('joinCode').value.toUpperCase()})}function start(){ack('startGame',{})}function chat(){ack('chat',{text:$('message').value,channel:$('channel').value},r=>{if(r.ok)$('message').value=''})}
function render(){if(!room||!state)return;let a=state.players.filter(p=>p.alive),h='';if(state.phase==='night'&&state.role==='imposter')h='<h2>🌙 Imposters: choose the same target</h2>'+a.filter(p=>p.id!==s.id).map(p=>`<label class="choice"><input type="radio" name="target" value="${p.id}"> ${esc(p.name)}</label>`).join('')+'<button class="red" onclick="target()">SUBMIT TARGET</button>';else if(state.phase==='heal'&&state.role==='doctor')h='<h2>💉 Choose one person to heal</h2>'+a.map(p=>`<label class="choice"><input type="radio" name="target" value="${p.id}"> ${esc(p.name)}</label>`).join('')+'<button class="green" onclick="heal()">HEAL</button>';else if(state.phase==='meeting'&&state.alive)h='<h2>🗳️ Vote for an imposter</h2>'+a.filter(p=>p.id!==s.id).map(p=>`<label class="choice"><input type="radio" name="target" value="${p.id}"> ${esc(p.name)}</label>`).join('')+'<button class="gold" onclick="vote()">VOTE</button><button onclick="ackVote()">SKIP</button>';else h='<p class="muted">Wait for the next phase. Eliminated players cannot act.</p>';$('actions').innerHTML=h}
function chosen(){return document.querySelector('input[name=target]:checked')?.value}function target(){if(chosen())ack('imposterTarget',{targetId:chosen()});else alert('Choose a target')}function heal(){if(chosen())ack('heal',{targetId:chosen()});else alert('Choose a player')}function vote(){if(chosen())ack('vote',{targetId:chosen()});else alert('Choose a player')}function ackVote(){ack('vote',{targetId:null})}function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
